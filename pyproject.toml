[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ez-ip-updater"
version = "2.1.0"
description = "Tự động phát hiện IP công cộng và cập nhật vào Google Cloud / AWS"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [ { name = "Le Quyet Tien" } ]
keywords = ["gcp", "aws", "ip", "firewall", "security-groups"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "requests",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-compute",
  "google-api-python-client"
]
aws = [
  "boto3"
]
all = ["google-cloud-compute", "google-api-python-client", "boto3"]

[project.scripts]
ez-ip-updater = "ez_ip_updater.cli:main"
ez-ip-updater-install = "ez_ip_updater.autostart:install_main"
ez-ip-updater-uninstall = "ez_ip_updater.autostart:uninstall_main"

[tool.setuptools.packages.find]
include = ["ez_ip_updater*"]
